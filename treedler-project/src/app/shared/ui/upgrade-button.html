<div class="relative w-full" (mouseenter)="onMouseEnter($event)" (mouseleave)="onMouseLeave()">
  <!-- ========================================== -->
  <!-- ACTION BUTTON                              -->
  <!-- ========================================== -->
  <button
    (click)="buy.emit()"
    [disabled]="!canAfford"
    class="w-full text-left px-3 py-4 rounded transition-colors border"
    [ngClass]="{
      'bg-gray-600 hover:bg-gray-500 border-gray-500': canAfford,
      'bg-gray-800 border-gray-700 cursor-not-allowed': !canAfford && isReachable,
      'bg-black border-gray-900 cursor-not-allowed': !isReachable,
    }"
  >
    <div
      class="font-bold text-sm flex justify-between items-center"
      [ngClass]="canAfford ? 'text-gray-100' : isReachable ? 'text-gray-400' : 'text-gray-600'"
    >
      <span>{{ title }}</span>
    </div>
  </button>

  <!-- ========================================== -->
  <!-- HOVER TOOLTIP                              -->
  <!-- ========================================== -->
  @if (isHovered()) {
    <div
      class="absolute left-1/2 -translate-x-1/2 w-64 p-3 bg-gray-900 border border-gray-600 rounded shadow-xl pointer-events-none z-50"
      [ngClass]="{
        'top-full mt-2': position() === 'bottom',
        'bottom-full mb-2': position() === 'top',
      }"
    >
      <div class="font-bold text-gray-200 mb-1 border-b border-gray-700 pb-1">{{ title }}</div>

      @if (description) {
        <div class="text-xs text-gray-400 mb-2 italic">{{ description }}</div>
      }

      <div class="text-xs font-semibold text-gray-300 mb-1 mt-2">Cost:</div>
      <div class="flex flex-col gap-1 mb-2">
        @for (cost of costs; track cost.resourceName) {
          <div class="flex justify-between text-xs">
            <span class="text-gray-400">{{ cost.resourceName }}</span>
            <span class="text-gray-200">{{ cost.amount }}</span>
          </div>
        }
      </div>

      <div class="text-xs font-semibold text-gray-300 mb-1">Effect:</div>
      <div class="text-xs text-green-400">{{ effect }}</div>
    </div>
  }
</div>
