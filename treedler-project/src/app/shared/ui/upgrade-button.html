<button
  (click)="buy.emit()"
  [disabled]="!canAfford"
  class="text-left p-2 rounded flex flex-col justify-between h-16 transition-all group w-full border"
  [ngClass]="customClasses"
>
  <div class="font-bold text-gray-100 text-sm">{{ title }}</div>

  <div class="flex justify-between items-end w-full mt-1">
    <div class="flex gap-1" [ngClass]="costTextClass">
      <span class="text-xs font-semibold">Cost:</span>
      @for (cost of costs; track cost.resourceName) {
        <span class="text-xs">{{ cost.amount }} {{ cost.resourceName }}</span>
      }
    </div>

    <span class="text-xs text-green-400 opacity-0 group-hover:opacity-100 transition-opacity">
      {{ effect }}
    </span>
  </div>
</button>
