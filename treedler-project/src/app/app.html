<div class="h-screen w-screen bg-gray-900 text-gray-100 p-4 flex flex-col overflow-hidden">
  <div class="w-full flex-1 min-h-0 flex flex-col md:flex-row gap-4">
    <!-- LEFT SIDEBAR: RESOURCES -->
    <div
      class="w-full md:w-64 shrink-0 h-full bg-gray-800 p-4 rounded shadow-lg border border-gray-700 flex flex-col"
    >
      <app-sidebar class="flex-1 min-h-0 block"></app-sidebar>
    </div>

    <!-- CENTER MAIN PANEL -->
    <div
      class="flex-1 bg-gray-800 p-6 rounded shadow-lg border border-gray-700 flex flex-col h-full overflow-hidden"
    >
      <!-- TOP NAVIGATION TABS (Storyline on the far right) -->
      <div
        class="h-10 flex items-center justify-between mb-6 border-b border-gray-700 pb-2 shrink-0"
      >
        <div class="flex gap-2">
          <button
            (click)="switchTab(Tab.Tree)"
            class="px-4 py-1.5 rounded font-bold text-sm transition-colors cursor-pointer"
            [ngClass]="
              activeTab() === Tab.Tree
                ? 'bg-gray-700 text-green-400'
                : 'text-gray-400 hover:bg-gray-700/50'
            "
          >
            Tree
          </button>

          @if (storylineService.isMutationUnlocked()) {
            <button
              (click)="switchTab(Tab.Mutation)"
              class="px-4 py-1.5 rounded font-bold text-sm transition-colors cursor-pointer"
              [ngClass]="
                activeTab() === Tab.Mutation
                  ? 'bg-gray-700 text-purple-400'
                  : 'text-purple-400/60 hover:bg-gray-700/50'
              "
            >
              Mutations
            </button>
          }

          @if (storylineService.isBloomUnlocked()) {
            <button
              (click)="switchTab(Tab.Bloom)"
              class="px-4 py-1.5 rounded font-bold text-sm transition-colors cursor-pointer"
              [ngClass]="
                activeTab() === Tab.Bloom
                  ? 'bg-gray-700 text-pink-400'
                  : 'text-pink-400/60 hover:bg-gray-700/50'
              "
            >
              Life Cycle
            </button>
          }
        </div>

        <!-- FAR RIGHT: STORYLINE TAB -->
        <button
          (click)="switchTab(Tab.Storyline)"
          class="px-4 py-1.5 rounded font-bold text-sm transition-colors ml-auto cursor-pointer"
          [ngClass]="
            activeTab() === Tab.Storyline
              ? 'bg-gray-700 text-amber-400'
              : 'text-amber-500/70 hover:bg-gray-700/50'
          "
        >
          Storyline
        </button>
      </div>

      <!-- TAB CONTENT -->
      <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar min-h-0">
        @if (activeTab() === Tab.Tree) {
          <app-tree-tab></app-tree-tab>
        }
        @if (activeTab() === Tab.Storyline) {
          <app-storyline-tab></app-storyline-tab>
        }
        @if (activeTab() === Tab.Mutation) {
          <app-mutation-tab></app-mutation-tab>
        }
        @if (activeTab() === Tab.Bloom) {
          <app-bloom-tab></app-bloom-tab>
        }
        @if (activeTab() === Tab.Settings) {
          <app-settings-tab></app-settings-tab>
        }
      </div>
    </div>

    <!-- RIGHT SIDEBAR: SETTINGS ON TOP + NARROW LOG PANEL BELOW -->
    <div class="w-full md:w-60 shrink-0 flex flex-col gap-3 h-full min-h-0">
      <button
        (click)="switchTab(Tab.Settings)"
        class="w-full py-2 px-4 rounded font-bold text-xs uppercase tracking-wider transition-all border flex items-center justify-center gap-2 shadow cursor-pointer shrink-0"
        [ngClass]="
          activeTab() === Tab.Settings
            ? 'bg-gray-700 text-green-400 border-green-500/60 shadow-[0_0_10px_rgba(34,197,94,0.15)]'
            : 'bg-gray-800 text-gray-300 border-gray-700 hover:bg-gray-700 hover:text-white'
        "
      >
        <span>⚙</span>
        <span>Settings</span>
      </button>

      <app-log-sidebar class="flex-1 min-h-0 block"></app-log-sidebar>
    </div>
  </div>
</div>
