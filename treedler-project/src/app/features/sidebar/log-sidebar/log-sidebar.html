<div
  class="w-full h-full bg-gray-800 p-4 rounded shadow-lg border transition-all duration-500 flex flex-col text-sm"
  [ngClass]="
    logService.hasUnreadLogs()
      ? 'border-amber-500/50 shadow-[0_0_15px_rgba(245,158,11,0.15)]'
      : 'border-gray-700'
  "
  (mouseenter)="logService.markAsRead()"
  (touchstart)="logService.markAsRead()"
>
  <div
    class="h-10 flex items-center justify-between mb-4 border-b transition-colors duration-500"
    [ngClass]="logService.hasUnreadLogs() ? 'border-amber-500/30' : 'border-gray-700'"
  >
    <h2
      class="font-bold transition-colors duration-500"
      [ngClass]="logService.hasUnreadLogs() ? 'text-amber-400' : 'text-gray-300'"
    >
      Event Log
    </h2>

    @if (logService.hasUnreadLogs()) {
      <span class="flex h-3 w-3 relative">
        <span
          class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"
        ></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span>
      </span>
    }
  </div>

  <!-- FILTERS -->
  <div class="flex gap-1 mb-3 bg-gray-900 p-1 rounded border border-gray-700">
    <button
      (click)="setFilter('All')"
      class="flex-1 py-1 px-2 text-xs font-bold rounded transition-colors"
      [ngClass]="
        activeFilter() === 'All' ? 'bg-gray-700 text-gray-100' : 'text-gray-500 hover:text-gray-300'
      "
    >
      All
    </button>
    <button
      (click)="setFilter(LogCategory.Story)"
      class="flex-1 py-1 px-2 text-xs font-bold rounded transition-colors"
      [ngClass]="
        activeFilter() === LogCategory.Story
          ? 'bg-gray-700 text-amber-400'
          : 'text-amber-600/80 hover:text-amber-400'
      "
    >
      Story
    </button>
    <button
      (click)="setFilter(LogCategory.Progress)"
      class="flex-1 py-1 px-2 text-xs font-bold rounded transition-colors"
      [ngClass]="
        activeFilter() === LogCategory.Progress
          ? 'bg-gray-700 text-green-400'
          : 'text-green-600/80 hover:text-green-400'
      "
    >
      Prog
    </button>
    <button
      (click)="setFilter(LogCategory.Random)"
      class="flex-1 py-1 px-2 text-xs font-bold rounded transition-colors"
      [ngClass]="
        activeFilter() === LogCategory.Random
          ? 'bg-gray-700 text-purple-400'
          : 'text-purple-600/80 hover:text-purple-400'
      "
    >
      Rand
    </button>
  </div>

  <!-- LOG LIST -->
  <div class="flex-1 overflow-y-auto flex flex-col gap-2 pr-1 custom-scrollbar">
    @if (filteredLogs().length === 0) {
      <div class="text-xs text-gray-600 italic text-center mt-4">No events recorded yet.</div>
    }

    @for (log of filteredLogs(); track log.id) {
      <div class="text-xs bg-gray-900/50 p-2 rounded border border-gray-700/50">
        <span [ngClass]="getCategoryColor(log.category)" class="font-semibold block mb-0.5">
          {{ log.text }}
        </span>
      </div>
    }
  </div>
</div>
