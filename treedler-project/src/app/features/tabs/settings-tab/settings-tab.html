<div class="flex flex-col gap-6">
  <div>
    <h3
      class="text-xs font-bold text-red-500 uppercase tracking-wider border-b border-gray-700 mb-2 pb-1"
    >
      Zarządzanie Zapisem
    </h3>

    <p class="text-sm text-gray-400 mb-4">
      Usunięcie zapisu spowoduje nieodwracalną utratę wszystkich surowców, ulepszeń oraz
      odblokowanych mechanik, przywracając grę do stanu początkowego.
    </p>

    <button
      (click)="wipeSave()"
      class="bg-red-900 hover:bg-red-800 border border-red-600 text-gray-100 text-sm font-bold py-2 px-4 rounded transition-all"
    >
      Twardy Reset (Wipe Save)
    </button>
  </div>
</div>
